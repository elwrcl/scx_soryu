[package]
name = "scx_soryu"
version = "0.1.0"
edition = "2021"
description = "BMQ policy port for sched_ext"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
ctrlc = { version = "3.4", features = ["termination"] }
libbpf-rs = "=0.26.2"
libc = "0.2"
log = "0.4"
scx_stats = "1.1.3"
scx_stats_derive = "1.1.3"
scx_utils = "1.1.3"
serde = { version = "1", features = ["derive"] }
crossbeam = "0.8"
simplelog = "0.12"

[build-dependencies]
scx_cargo = "1.1.3"

[profile.release]
lto = "thin"
panic = "abort"
